# ── Rate limiting zones ─────────────────────────────────────────────────────
# General API: 20 req/s per IP, burst to 60
limit_req_zone $binary_remote_addr zone=chat_api:10m rate=20r/s;
# Signin: 30 req/min per IP — allows large ministry/company WiFi morning rush (burst=50), blocks bots
# Note: Open WebUI has no built-in account lockout, so nginx is the only protection.
limit_req_zone $binary_remote_addr zone=chat_signin:10m rate=30r/m;

# ── Known attacker blocklist ────────────────────────────────────────────────
geo $blocked_ip {
    default         0;
    185.177.72.61   1;  # repeat credential/config scanner (3 rounds in 61h)
    35.216.140.3    1;  # .env, .git, .aws scanner
    84.239.49.0/24  1;  # credential stuffing subnet (57 signin attempts)
    195.178.110.161 1;  # POST flood (50 requests in 10s)
}

server {
    listen 80;
    server_name chat.copai.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat.copai.ai;

    server_tokens off;
    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/chat.copai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.copai.ai/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' wss:; font-src 'self' data:; frame-ancestors 'self';" always;

    # ── Block known attackers ────────────────────────────────────────────────
    if ($blocked_ip) {
        return 444;  # silent drop, no response body
    }

    # ── Block sensitive files & paths ───────────────────────────────────────
    # Dot files: .env, .env.local, .env.production, .git/config, .aws/credentials etc.
    location ~ /\. {
        deny all;
        return 404;
    }
    # Sensitive named files that don't start with a dot
    location ~* (docker-compose.*\.ya?ml|config\.json|/metrics) {
        deny all;
        return 404;
    }

    # ── Prometheus metrics — internal only ──────────────────────────────────
    # If you need to access /metrics from Grafana on the same host, uncomment:
    # location /metrics {
    #     allow 127.0.0.1;
    #     deny all;
    # }

    # ── Block source maps & API schema ─────────────────────────────────────
    location ~* \.js\.map$ {
        deny all;
        return 404;
    }
    location ~* ^/(docs|redoc|openapi\.json)$ {
        deny all;
        return 404;
    }

    # ── Signin — separate stricter rate limit ────────────────────────────────
    location = /api/v1/auths/signin {
        limit_req zone=chat_signin burst=50 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_buffering off;
    }

    # ── Static assets — no rate limiting, cache in browser ──────────────────
    location ~* ^/(_app|static)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_buffering off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Everything else — general rate limit ────────────────────────────────
    location / {
        limit_req zone=chat_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
