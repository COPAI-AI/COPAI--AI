# Rate limiting: applied to API endpoints only, not static assets
limit_req_zone $binary_remote_addr zone=chat_api:10m rate=20r/s;

server {
    listen 80;
    server_name chat.copai.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat.copai.ai;

    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/chat.copai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.copai.ai/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block sensitive files
    location ~ /\.(env|git|gitignore) {
        deny all;
        return 404;
    }

    # Static assets — no rate limiting, cache in browser
    location ~* ^/(_app|static)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API and everything else — rate limited
    location / {
        limit_req zone=chat_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
