global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ['127.0.0.1:8000']
    metrics_path: /metrics

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: qdrant
    static_configs:
      - targets: ['127.0.0.1:6333']
    metrics_path: /metrics

  - job_name: gpu
    static_configs:
      - targets: ['127.0.0.1:9400']
    metrics_path: /metrics
